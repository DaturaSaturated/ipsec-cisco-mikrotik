! Конфигурация IPsec для стенда GNS3. Внешние адреса заменены на TEST-NET.
crypto ikev2 proposal IKEv2_PROPOSAL
 encryption aes-cbc-256
 integrity sha256
 group 14
crypto ikev2 policy IKEv2_POLICY
 proposal IKEv2_PROPOSAL
crypto ikev2 keyring IKEV2_KEYRING
 peer MT_PEER
  address 192.0.2.5
  pre-shared-key <SHARED_KEY>
crypto ikev2 profile IKEV2_PROFILE
 match identity remote address 192.0.2.5 255.255.255.255
 identity local address 192.0.2.6
 authentication remote pre-share
 authentication local pre-share
 keyring local IKEV2_KEYRING
crypto ipsec transform-set TS esp-aes 256 esp-sha256-hmac
 mode tunnel
ip access-list extended IPSEC-TRAFFIC
 permit ip 10.1.1.0 0.0.0.255 192.168.15.0 0.0.0.255
crypto map IPSEC-MAP 10 ipsec-isakmp
 set peer 192.0.2.5
 set transform-set TS
 set ikev2-profile IKEV2_PROFILE
 match address IPSEC-TRAFFIC
 set pfs group14
interface GigabitEthernet0/0
 crypto map IPSEC-MAP
